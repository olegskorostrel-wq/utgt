name: Проверка замен и деплой сайта

on:
  schedule:
    # каждые 2 часа с 07:17 до 21:17 по Москве (cron в UTC)
    - cron: "17 4-18/2 * * *"
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить tesseract (русский)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-rus

      - run: pip install -r requirements.txt

      - name: Тесты
        run: |
          python -m pytest tests -q
          node --test tests/

      - name: Проверить страницу замен
        id: scrape
        continue-on-error: true
        run: python scraper.py

      - name: Сохранить новые замены в репозиторий
        if: github.ref == 'refs/heads/main'
        run: |
          git add data/zameny
          if git diff --cached --quiet; then
            echo "Новых замен нет"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Замены: обновление $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Собрать сайт
        run: python build_site.py ${{ steps.scrape.outcome == 'failure' && '--scrape-failed' || '' }}

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

      - name: Проверка замен упала
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::scraper.py завершился с ошибкой — сайт собран со старыми данными"

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
